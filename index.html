<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TafsirLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens ---------- */
:root {
  --bg: oklch(0.987 0.003 80);
  --bg-elev: oklch(0.995 0.002 80);
  --panel: oklch(0.97 0.004 80);
  --panel-2: oklch(0.945 0.005 80);
  --ink: oklch(0.22 0.012 80);
  --ink-2: oklch(0.38 0.012 80);
  --ink-3: oklch(0.56 0.01 80);
  --ink-4: oklch(0.72 0.008 80);
  --line: oklch(0.22 0.012 80 / 0.09);
  --line-strong: oklch(0.22 0.012 80 / 0.16);
  --hover: oklch(0.22 0.012 80 / 0.045);
  --active: oklch(0.22 0.012 80 / 0.075);
  --shadow-sm: 0 1px 2px oklch(0.22 0.012 80 / 0.04), 0 1px 1px oklch(0.22 0.012 80 / 0.02);
  --shadow-md: 0 4px 12px oklch(0.22 0.012 80 / 0.06), 0 2px 4px oklch(0.22 0.012 80 / 0.04);
  --shadow-lg: 0 24px 48px oklch(0.22 0.012 80 / 0.1), 0 8px 16px oklch(0.22 0.012 80 / 0.06);
  --accent: oklch(0.55 0.08 160);
  --accent-soft: oklch(0.55 0.08 160 / 0.1);
  --accent-ink: oklch(0.42 0.07 160);
  --rail: 56px;
  --sidebar: 272px;
  --drawer: 440px;
  --radius: 6px;
  --radius-lg: 10px;
  --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-serif: "IBM Plex Serif", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --font-arabic: "Amiri Quran", "Amiri", serif;
  --row-h: 28px;
  --canvas-pad-y: 72px;
  --canvas-max: 740px;
}
[data-density="compact"] { --row-h: 24px; --canvas-pad-y: 48px; }
[data-density="cozy"]    { --row-h: 28px; --canvas-pad-y: 72px; }
[data-density="roomy"]   { --row-h: 34px; --canvas-pad-y: 104px; }
[data-canvas="focused"]  { --canvas-max: 720px; }
[data-canvas="wide"]     { --canvas-max: 920px; }
[data-accent="emerald"]  { --accent: oklch(0.55 0.08 160); --accent-soft: oklch(0.55 0.08 160 / 0.1); --accent-ink: oklch(0.42 0.07 160); }
[data-accent="amber"]    { --accent: oklch(0.62 0.11 70);  --accent-soft: oklch(0.62 0.11 70 / 0.12);  --accent-ink: oklch(0.5 0.1 70); }
[data-accent="indigo"]   { --accent: oklch(0.52 0.12 275); --accent-soft: oklch(0.52 0.12 275 / 0.1);  --accent-ink: oklch(0.42 0.11 275); }
[data-theme="dark"] {
  --bg: oklch(0.17 0.008 250); --bg-elev: oklch(0.2 0.008 250);
  --panel: oklch(0.22 0.008 250); --panel-2: oklch(0.26 0.008 250);
  --ink: oklch(0.94 0.005 80); --ink-2: oklch(0.78 0.006 80);
  --ink-3: oklch(0.6 0.008 250); --ink-4: oklch(0.44 0.01 250);
  --line: oklch(0.94 0.005 80 / 0.09); --line-strong: oklch(0.94 0.005 80 / 0.16);
  --hover: oklch(0.94 0.005 80 / 0.05); --active: oklch(0.94 0.005 80 / 0.09);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.25);
  --shadow-lg: 0 24px 48px rgba(0,0,0,0.5), 0 8px 16px rgba(0,0,0,0.3);
}
[data-theme="dark"][data-accent="emerald"] { --accent: oklch(0.68 0.1 160); --accent-soft: oklch(0.68 0.1 160 / 0.15); --accent-ink: oklch(0.78 0.1 160); }
[data-theme="dark"][data-accent="amber"]   { --accent: oklch(0.76 0.12 70); --accent-soft: oklch(0.76 0.12 70 / 0.15);  --accent-ink: oklch(0.84 0.1 70); }
[data-theme="dark"][data-accent="indigo"]  { --accent: oklch(0.7 0.13 275); --accent-soft: oklch(0.7 0.13 275 / 0.15);  --accent-ink: oklch(0.78 0.12 275); }

/* ---------- Reset ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { font-family: var(--font-sans); font-size: 14px; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-feature-settings: "ss01","cv11"; }
#root { height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
[contenteditable]:focus { outline: none; }
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
.scroll::-webkit-scrollbar-thumb:hover { background: var(--ink-4); background-clip: content-box; border: 2px solid transparent; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: var(--rail) var(--sidebar) minmax(0,1fr); height: 100vh; width: 100vw; overflow: hidden; background: var(--bg); position: relative; }

/* ---------- Rail ---------- */
.rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; background: var(--bg); z-index: 5; }
.rail-logo { width: 36px; height: 36px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-serif); font-weight: 600; font-size: 17px; letter-spacing: -0.02em; margin-bottom: 8px; }
.rail-btn { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); position: relative; transition: background .12s, color .12s; }
.rail-btn:hover { background: var(--hover); color: var(--ink); }
.rail-btn[data-active="true"] { background: var(--active); color: var(--ink); }
.rail-btn[data-active="true"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 2px; background: var(--accent); border-radius: 2px; }
.rail-spacer { flex: 1; }
.rail-divider { width: 20px; height: 1px; background: var(--line); margin: 6px 0; }
.rail-ws { width: 32px; height: 32px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); background: var(--panel); border: 1px solid var(--line); transition: transform .12s, box-shadow .12s; }
.rail-ws:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.rail-ws[data-active="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rail-account { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, oklch(0.55 0.08 160) 0%, oklch(0.42 0.07 160) 100%); color: white; display: grid; place-items: center; font-size: 11px; font-weight: 600; position: relative; cursor: pointer; }
.rail-account::after { content: ""; position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-radius: 50%; background: oklch(0.68 0.15 145); border: 2px solid var(--bg); }

/* ---------- Sidebar ---------- */
.sidebar { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.sidebar-head { padding: 14px 14px 10px 14px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.ws-switcher { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 6px; flex: 1; min-width: 0; transition: background .12s; }
.ws-switcher:hover { background: var(--hover); }
.ws-switcher-avatar { width: 22px; height: 22px; border-radius: 5px; background: linear-gradient(135deg, var(--accent), var(--accent-ink)); color: white; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.ws-switcher-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-switcher-caret { color: var(--ink-4); flex-shrink: 0; }
.sidebar-search { margin: 0 10px 6px 10px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border: 1px solid transparent; border-radius: 6px; color: var(--ink-3); font-size: 13px; transition: background .12s, border-color .12s; }
.sidebar-search:hover { background: var(--panel-2); }
.sidebar-search:focus-within { background: var(--bg-elev); border-color: var(--line-strong); }
.sidebar-search input { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; color: var(--ink); }
.sidebar-search input::placeholder { color: var(--ink-4); }
.sidebar-search-kbd { font-family: var(--font-mono); font-size: 11px; color: var(--ink-4); padding: 1px 5px; border: 1px solid var(--line-strong); border-radius: 4px; }
.sidebar-section { padding: 10px 10px 4px 16px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-4); display: flex; align-items: center; justify-content: space-between; }
.sidebar-section-add { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-4); opacity: 0; transition: opacity .12s, background .12s; }
.sidebar-section:hover .sidebar-section-add { opacity: 1; }
.sidebar-section-add:hover { background: var(--hover); color: var(--ink); }
.tree { padding: 0 6px 16px 6px; flex: 1; overflow-y: auto; }
.tree-row { display: flex; align-items: center; gap: 2px; height: var(--row-h); padding: 0 6px 0 0; border-radius: 5px; color: var(--ink-2); font-size: 13px; cursor: pointer; user-select: none; position: relative; }
.tree-row:hover { background: var(--hover); color: var(--ink); }
.tree-row[data-active="true"] { background: var(--active); color: var(--ink); font-weight: 500; }
.tree-chevron { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-4); border-radius: 3px; flex-shrink: 0; transition: transform .12s; }
.tree-chevron:hover { background: var(--line); color: var(--ink); }
.tree-chevron[data-open="true"] { transform: rotate(90deg); }
.tree-chevron[data-empty="true"] { visibility: hidden; }
.tree-icon { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink-3); flex-shrink: 0; }
.tree-row[data-active="true"] .tree-icon { color: var(--accent); }
.tree-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-4); padding: 0 4px; }
.tree-more { width: 18px; height: 18px; border-radius: 3px; display: grid; place-items: center; opacity: 0; color: var(--ink-3); }
.tree-row:hover .tree-more { opacity: 1; }
.tree-more:hover { background: var(--line); color: var(--ink); }
.tree-children { position: relative; }
.tree-children::before { content: ""; position: absolute; top: 0; bottom: 4px; left: 15px; width: 1px; background: var(--line); }

/* ---------- Canvas ---------- */
.canvas { overflow-y: auto; position: relative; background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { position: sticky; top: 0; z-index: 4; background: color-mix(in oklch, var(--bg) 82%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 10px 20px; gap: 10px; min-height: 48px; }
.crumbs { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-3); flex: 1; min-width: 0; }
.crumb { padding: 3px 6px; border-radius: 4px; white-space: nowrap; transition: background .12s, color .12s; }
.crumb:hover { background: var(--hover); color: var(--ink); }
.crumb[data-current="true"] { color: var(--ink); font-weight: 500; }
.crumb-sep { color: var(--ink-4); font-size: 12px; }
.topbar-actions { display: flex; align-items: center; gap: 4px; }
.tb-btn { height: 28px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; transition: background .12s, color .12s; }
.tb-btn:hover { background: var(--hover); color: var(--ink); }
.tb-btn[data-active="true"] { background: var(--active); color: var(--ink); }
.tb-icon { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); transition: background .12s, color .12s; }
.tb-icon:hover { background: var(--hover); color: var(--ink); }
.tb-divider { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.tb-share { height: 28px; padding: 0 12px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: opacity .12s; }
.tb-share:hover { opacity: 0.88; }
.doc-wrap { width: 100%; display: flex; justify-content: center; padding: 0 48px; }
.doc { width: 100%; max-width: var(--canvas-max); padding: var(--canvas-pad-y) 0 240px 0; }
.doc-cover { margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
.doc-cover-tag { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
.doc-title { font-family: var(--font-serif); font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); margin: 0; text-wrap: pretty; }
.doc-meta { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.doc-meta-item { display: flex; align-items: center; gap: 5px; }
.doc-meta-avatar { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-ink)); color: white; display: grid; place-items: center; font-size: 9.5px; font-weight: 600; }

/* Blocks */
.block { position: relative; padding: 3px 0; margin: 0; }
.block-handle { position: absolute; left: -34px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.block:hover .block-handle { opacity: 1; }
.handle-btn { width: 18px; height: 22px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-4); cursor: grab; }
.handle-btn:hover { background: var(--hover); color: var(--ink-2); }
.block p, .block-p { font-family: var(--font-serif); font-size: 16.5px; line-height: 1.65; margin: 0; color: var(--ink); text-wrap: pretty; }
.block-h1 { font-family: var(--font-serif); font-size: 30px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; margin: 32px 0 4px 0; color: var(--ink); }
.block-h2 { font-family: var(--font-serif); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; margin: 28px 0 4px 0; color: var(--ink); }
.block-h3 { font-family: var(--font-sans); font-size: 14px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-2); margin: 24px 0 2px 0; }
.block-callout { display: flex; gap: 12px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); margin: 8px 0; }
.callout-icon { width: 22px; height: 22px; flex-shrink: 0; display: grid; place-items: center; color: var(--accent-ink); margin-top: 2px; }
.callout-body { font-family: var(--font-serif); font-size: 15px; line-height: 1.6; color: var(--ink-2); }
.block-divider { height: 1px; background: var(--line); margin: 24px 0; }
.block-quote { margin: 10px 0; padding: 4px 0 4px 18px; border-left: 2px solid var(--line-strong); font-family: var(--font-serif); font-style: italic; color: var(--ink-2); line-height: 1.6; }
.block-list { margin: 4px 0; padding-left: 22px; font-family: var(--font-serif); font-size: 16px; line-height: 1.7; }
.block-list li { margin: 2px 0; color: var(--ink); }
.block-list li::marker { color: var(--ink-4); }

/* Verse block */
.verse-block { margin: 18px 0; padding: 22px 26px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 14px; position: relative; transition: border-color .15s, box-shadow .15s; }
.verse-block:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm); }
.verse-block[data-active="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.verse-header { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
.verse-ref { display: flex; align-items: center; gap: 8px; }
.verse-ref-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.verse-actions { display: flex; gap: 2px; }
.verse-action { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: var(--ink-3); opacity: 0; transition: opacity .12s, background .12s, color .12s; }
.verse-block:hover .verse-action { opacity: 1; }
.verse-action:hover { background: var(--hover); color: var(--ink); }
.verse-action[data-active="true"] { opacity: 1; background: var(--accent-soft); color: var(--accent-ink); }
.verse-arabic { font-family: var(--font-arabic); font-size: 28px; line-height: 2.1; direction: rtl; text-align: right; color: var(--ink); letter-spacing: 0; }
.verse-translit { font-family: var(--font-serif); font-style: italic; font-size: 14.5px; color: var(--ink-3); line-height: 1.5; }
.verse-translation { font-family: var(--font-serif); font-size: 16px; line-height: 1.55; color: var(--ink); }
.verse-translation .tr-num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-4); vertical-align: super; margin-right: 2px; }
.verse-anchor { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; margin: 0 1px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; color: var(--accent-ink); background: var(--accent-soft); cursor: pointer; transition: background .12s; text-decoration: none; white-space: nowrap; }
.verse-anchor:hover { background: color-mix(in oklch, var(--accent) 22%, transparent); }

/* Add block */
.add-block { height: 28px; display: flex; align-items: center; gap: 6px; color: var(--ink-4); font-size: 13px; padding: 0 4px; border-radius: 5px; opacity: 0; transition: opacity .15s, background .12s; margin-top: 4px; width: fit-content; }
.doc:hover .add-block { opacity: 1; }
.add-block:hover { background: var(--hover); color: var(--ink-2); }

/* Slash menu */
.slash-menu { position: absolute; background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 6px; width: 280px; z-index: 50; max-height: 340px; overflow-y: auto; }
.slash-section { padding: 6px 8px 2px 8px; font-size: 10.5px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-4); }
.slash-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--ink); }
.slash-item:hover, .slash-item[data-selected="true"] { background: var(--hover); }
.slash-item-icon { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; color: var(--ink-2); flex-shrink: 0; }
.slash-item-text { min-width: 0; }
.slash-item-name { font-size: 13px; font-weight: 500; }
.slash-item-desc { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }

/* Format bar */
.format-bar { position: absolute; background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow-md); padding: 4px; display: flex; gap: 1px; z-index: 40; }
.fb-btn { width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; transition: background .12s, color .12s; }
.fb-btn:hover, .fb-btn[data-active="true"] { background: var(--hover); color: var(--ink); }
.fb-sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; align-self: center; }

/* Drawer */
.drawer-overlay { position: fixed; inset: 0 0 0 auto; width: var(--drawer); z-index: 30; background: color-mix(in oklch, var(--bg-elev) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-left: 1px solid var(--line-strong); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.app[data-glass="medium"] .drawer-overlay { background: color-mix(in oklch, var(--bg-elev) 78%, transparent); backdrop-filter: blur(20px) saturate(140%); }
.app[data-glass="heavy"]  .drawer-overlay { background: color-mix(in oklch, var(--bg-elev) 60%, transparent); backdrop-filter: blur(30px) saturate(180%); }
.drawer-overlay[data-open="true"] { transform: translateX(0); }
.drawer-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer-head-title { flex: 1; font-size: 13.5px; font-weight: 500; color: var(--ink); min-width: 0; }
.drawer-head-ref { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.drawer-close { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-3); }
.drawer-close:hover { background: var(--hover); color: var(--ink); }
.drawer-tabs { padding: 8px 14px 0 14px; display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.drawer-tab { padding: 8px 10px; font-size: 13px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s, border-color .12s; }
.drawer-tab:hover { color: var(--ink); }
.drawer-tab[data-active="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 22px 40px 22px; }
.drawer-verse { padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); margin-bottom: 22px; }
.drawer-verse-arabic { font-family: var(--font-arabic); font-size: 22px; direction: rtl; text-align: right; line-height: 1.9; color: var(--ink); margin-bottom: 10px; }
.drawer-verse-translation { font-family: var(--font-serif); font-size: 14.5px; color: var(--ink-2); line-height: 1.55; }
.commentary-section { margin-bottom: 26px; }
.commentary-author { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.commentary-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-serif); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.commentary-name { font-size: 13.5px; font-weight: 500; color: var(--ink); }
.commentary-sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); margin-top: 1px; letter-spacing: 0.03em; }
.commentary-body { font-family: var(--font-serif); font-size: 14.5px; line-height: 1.7; color: var(--ink); }
.commentary-body p { margin: 0 0 10px 0; }
.commentary-body .arabic { font-family: var(--font-arabic); font-size: 17px; direction: rtl; color: var(--ink); margin: 0 4px; }
.lang-list { display: flex; flex-direction: column; gap: 4px; }
.lang-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; transition: border-color .12s; }
.lang-item:hover { border-color: var(--line-strong); }
.lang-item[data-active="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lang-item-name { font-size: 13.5px; font-weight: 500; }
.lang-item-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; font-family: var(--font-mono); }
.wbw { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 10px; }
.wbw-cell { padding: 12px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 8px; text-align: center; }
.wbw-ar { font-family: var(--font-arabic); font-size: 18px; direction: rtl; color: var(--ink); margin-bottom: 4px; }
.wbw-tr { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.02em; }
.wbw-en { font-family: var(--font-serif); font-size: 12.5px; color: var(--ink); margin-top: 4px; }

/* Tweaks */
.tweaks-panel { position: fixed; bottom: 20px; right: 20px; width: 300px; background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow-lg); z-index: 100; overflow: hidden; }
.tweaks-head { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.tweaks-title { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
.tweaks-close { color: var(--ink-3); width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; }
.tweaks-close:hover { background: var(--hover); color: var(--ink); }
.tweaks-body { padding: 12px 14px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.tw-row { display: flex; flex-direction: column; gap: 6px; }
.tw-label { font-size: 11px; color: var(--ink-3); letter-spacing: 0.03em; text-transform: uppercase; font-weight: 500; }
.tw-segments { display: flex; gap: 2px; padding: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
.tw-seg { flex: 1; padding: 5px 8px; border-radius: 5px; font-size: 12px; color: var(--ink-2); text-align: center; transition: background .12s, color .12s; }
.tw-seg:hover { color: var(--ink); }
.tw-seg[data-active="true"] { background: var(--bg-elev); color: var(--ink); font-weight: 500; box-shadow: var(--shadow-sm); }
.tw-swatches { display: flex; gap: 6px; }
.tw-swatch { flex: 1; height: 28px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; position: relative; transition: border-color .12s; }
.tw-swatch:hover { border-color: var(--line-strong); }
.tw-swatch[data-active="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tw-swatch-dot { width: 10px; height: 10px; border-radius: 50%; }

/* Utility */
.dim { color: var(--ink-3); }
.kbd { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); padding: 1px 5px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg-elev); }

@media (max-width: 760px) {
  .app { grid-template-columns: var(--rail) 0 minmax(0,1fr); }
  .doc-wrap { padding: 0 24px; }
  .drawer-overlay { width: min(440px,100vw); }
}
@media (max-width: 1100px) { .doc-wrap { padding: 0 28px; } }

const buildDoc = (openVerse) => [
  { type:"h2", id:"b1", text:"Question 1 of 8 · Quranic Studies Framework" },
  { type:"callout", id:"b2", icon:"Sparkle", text:<>The Prophet ﷺ said Al-Fatiha is <em>Umm al-Kitāb</em> — the Mother of the Book. Before reading any tafsīr, we begin by asking: <b>what is this Surah called, and why?</b> Every name opens a window onto its function.</> },
  { type:"p", id:"b3", text:<>Surah <b>Al-Fatiha</b> is the opening chapter of the Qur'an, consisting of seven short verses <VerseAnchor vref="Q 1:1–7" onOpen={openVerse}/>. Classical scholars record more than twenty names for it — an abundance that, as Al-Suyūṭī notes, is itself an indication of its rank. The names fall into four clusters: names about <b>position</b>, names about <b>function</b>, names about <b>content</b>, and names of <b>praise</b>.</> },
  { type:"verse", id:"v1", verse:SURAH_FATIHA[0], label:"Opening verse" },
  { type:"h3", id:"b4", text:"Names about position" },
  { type:"p", id:"b5", text:<><b>Fātiḥat al-Kitāb</b> (<i>The Opener of the Book</i>) — because the muṣḥaf begins with it. It is also called <b>Awwal al-Qur'ān</b> for the same reason, though scholars dispute whether it was the first Surah revealed or only the first by order of compilation (see <VerseAnchor vref="Q 96:1–5" onOpen={openVerse}/> for the first revelation).</> },
  { type:"list", id:"b6", items:[<><b>Al-Fātiḥa</b> — "the opening"; its most widely-used name.</>, <><b>Fātiḥat al-Kitāb</b> — "the opener of the Book".</>, <><b>Awwal al-Qur'ān</b> — "the first of the Qur'an".</>] },
  { type:"h3", id:"b7", text:"Names about function — prayer" },
  { type:"p", id:"b8", text:<><b>Al-Ṣalāh</b> (<i>the prayer</i>) appears in a famous divine ḥadīth qudsī, where Allah says, "I have divided the prayer between Myself and My servant" — referring to Al-Fatiha. Its function is liturgical: without it, the ṣalāh is not valid.</> },
  { type:"quote", id:"b9", text:<>"There is no prayer for one who does not recite the opening of the Book." — reported by Al-Bukhārī &amp; Muslim, from ʿUbādah ibn al-Ṣāmit.</> },
  { type:"list", id:"b10", items:[<><b>Al-Ṣalāh</b> — "the prayer" itself.</>, <><b>Al-Kāfiya</b> — "the sufficient".</>, <><b>Al-Wāfiya</b> — "the complete".</>] },
  { type:"h3", id:"b11", text:"Names about content" },

const { useState, useEffect, useRef, useMemo } = React;

function filterNodes(nodes, q) {
  const out = [];
  for (const n of nodes) {
    if (n.title.toLowerCase().includes(q)) { out.push(n); }
    else if (n.children) {
      const kids = filterNodes(n.children, q);
      if (kids.length) out.push({ ...n, children: kids, open: true });
    }
  }
  return out;
}

function TreeNode({ node, depth, activeId, onSelect, searchQuery }) {
  const [open, setOpen] = useState(node.open !== false);
  const hasChildren = node.children && node.children.length > 0;
  const isActive = activeId === node.id;

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const matchesSelf = node.title.toLowerCase().includes(q);
    const matchingDescendants = hasChildren ? filterNodes(node.children, q) : [];
    if (!matchesSelf && matchingDescendants.length === 0) return null;
    node = { ...node, children: matchesSelf ? node.children : matchingDescendants };
  }

  const iconFor = () => {
    if (node.type === "notebook") return <Icons.Notebook size={14}/>;
    if (node.type === "section") return <Icons.Folder size={14}/>;
    if (node.type === "surah") return <Icons.Book size={14}/>;
    if (node.page) return <Icons.Page size={14}/>;
    return <Icons.File size={14}/>;
  };

  return (
    <div>
      <div className="tree-row" data-active={isActive} style={{ paddingLeft: depth * 12 + 4 }}
        onClick={() => { if (node.page) onSelect(node.id); else if (hasChildren) setOpen(!open); }}>
        <div className="tree-chevron" data-open={open} data-empty={!hasChildren}
          onClick={e => { e.stopPropagation(); setOpen(!open); }}>
          <Icons.Chevron size={11}/>
        </div>
        <div className="tree-icon">{iconFor()}</div>
        <div className="tree-label">{node.title}</div>
        {hasChildren && !node.page && <div className="tree-count">{node.children.length}</div>}
        <div className="tree-more" onClick={e => e.stopPropagation()} title="More">
          <Icons.DotsH size={12}/>
        </div>
      </div>
      {hasChildren && open && (
        <div className="tree-children">
          {node.children.map(c => (
            <TreeNode key={c.id} node={c} depth={depth+1} activeId={activeId} onSelect={onSelect} searchQuery={searchQuery}/>
          ))}
        </div>
      )}
    </div>
  );
}

function Block({ block, active, onOpenVerse, onActivate }) {
  const CE = text => typeof text === "string" ? { contentEditable:true, suppressContentEditableWarning:true } : {};
  const Row = ({ children }) => (
    <div className="block" data-focused={active}>
      <div className="block-handle">
        <button className="handle-btn" title="Add"><Icons.Plus size={13}/></button>
        <button className="handle-btn" title="Drag"><Icons.Grip size={13}/></button>
      </div>
      {children}
    </div>
  );
  if (block.type==="h1")      return <Row><h1 className="block-h1" {...CE(block.text)}>{block.text}</h1></Row>;
  if (block.type==="h2")      return <Row><h2 className="block-h2" {...CE(block.text)}>{block.text}</h2></Row>;
  if (block.type==="h3")      return <Row><h3 className="block-h3" {...CE(block.text)}>{block.text}</h3></Row>;
  if (block.type==="p")       return <Row><p  className="block-p"  {...CE(block.text)}>{block.text}</p></Row>;
  if (block.type==="divider") return <Row><div className="block-divider"/></Row>;
  if (block.type==="quote")   return <Row><div className="block-quote"  {...CE(block.text)}>{block.text}</div></Row>;
  if (block.type==="list")    return <Row><ul className="block-list">{block.items.map((it,i) => <li key={i}>{it}</li>)}</ul></Row>;
  if (block.type==="callout") {
    const IC = Icons[block.icon] || Icons.Callout;
    return <Row><div className="block-callout"><div className="callout-icon"><IC size={18}/></div><div className="callout-body">{block.text}</div></div></Row>;
  }
  if (block.type==="verse") {
    const v = block.verse;
    const ref = `Q 1:${v.n}`;
    return (
      <div className="verse-block" data-active={active} onClick={() => onActivate && onActivate(block.id)}>
        <div className="verse-header">
          <div className="verse-ref"><span className="verse-ref-dot"/><span>{ref} · {block.label||"Verse"}</span></div>
          <div className="verse-actions">
            <button className="verse-action" title="Copy" onClick={e => e.stopPropagation()}><Icons.Copy size={13}/></button>
            <button className="verse-action" title="Bookmark" onClick={e => e.stopPropagation()}><Icons.Bookmark size={13}/></button>
            <button className="verse-action" data-active={active} title="Open tafsīr"
              onClick={e => { e.stopPropagation(); onOpenVerse(ref); }}><Icons.BookOpen size={13}/></button>
          </div>
        </div>
        <div className="verse-arabic">{v.ar}</div>
        <div className="verse-translit">{v.tl}</div>
        <div className="verse-translation"><span className="tr-num">{v.n}</span>{v.en}</div>
      </div>
    );
  }
  return null;
}

function Editor({ doc, openVerse, activeVerseRef, activeBlockId, onActivateBlock }) {
  const [slashOpen, setSlashOpen] = useState(false);
  const [slashPos, setSlashPos]   = useState({ top:0, left:0 });
  const [slashSel, setSlashSel]   = useState(0);
  const [slashFilter, setSlashFilter] = useState("");
  const [fmtBar, setFmtBar] = useState(null);
  const docRef = useRef(null);

  useEffect(() => {
    const onKey = e => {
      if (!(e.target && e.target.isContentEditable)) return;
      if (e.key === "/") {
        const sel = window.getSelection();
        if (sel && sel.rangeCount) {
          const rect = sel.getRangeAt(0).getBoundingClientRect();
          const cont = docRef.current.getBoundingClientRect();
          setSlashPos({ top: rect.bottom - cont.top + 6, left: rect.left - cont.left });
          setSlashOpen(true); setSlashSel(0); setSlashFilter("");
        }
      }
      if (slashOpen) {
        if (e.key==="ArrowDown")  { e.preventDefault(); setSlashSel(s => s+1); }
        if (e.key==="ArrowUp")    { e.preventDefault(); setSlashSel(s => Math.max(s-1,0)); }
        if (e.key==="Escape")     setSlashOpen(false);
        if (e.key==="Enter")      { e.preventDefault(); setSlashOpen(false); }
      }
    };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [slashOpen, slashFilter]);

  useEffect(() => {
    const onSel = () => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) { setFmtBar(null); return; }
      const node = sel.anchorNode;
      if (!node) { setFmtBar(null); return; }
      const el = node.nodeType===1 ? node : node.parentElement;
      if (!el || !el.closest(".doc")) { setFmtBar(null); return; }
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      if (rect.width < 2) { setFmtBar(null); return; }
      const cont = docRef.current.getBoundingClientRect();
      setFmtBar({ top: rect.top-cont.top-42, left: rect.left-cont.left+rect.width/2-130,
        bold: document.queryCommandState("bold"), italic: document.queryCommandState("italic"),
        under: document.queryCommandState("underline") });
    };
    document.addEventListener("selectionchange", onSel);
    return () => document.removeEventListener("selectionchange", onSel);
  }, []);

  const exec = cmd => document.execCommand(cmd, false, null);
  const filteredSlash = SLASH_ITEMS.map(g => ({ ...g, items: g.items.filter(i => i.name.toLowerCase().includes(slashFilter.toLowerCase())) })).filter(g => g.items.length);

  return (
    <div className="doc-wrap">
      <div className="doc" ref={docRef}>
        <div className="doc-cover">
          <div className="doc-cover-tag">Quranic Studies · Surah Al-Fatiha · Question 1</div>
          <h1 className="doc-title" contentEditable suppressContentEditableWarning>Names of the Surah, and why</h1>
          <div className="doc-meta">
            <div className="doc-meta-item"><div className="doc-meta-avatar">AB</div><span>Abdullah B.</span></div>
            <span>·</span>
            <div className="doc-meta-item"><Icons.History size={12}/> Edited 2 hours ago</div>
            <span>·</span>
            <div className="doc-meta-item"><Icons.Comment size={12}/> 4 comments</div>
            <span>·</span>
            <div className="doc-meta-item"><Icons.BookOpen size={12}/> 12 min read</div>
          </div>
        </div>

        {doc.map(b => (
          <Block key={b.id} block={b}
            active={(b.type==="verse" && activeVerseRef===`Q 1:${b.verse.n}`) || activeBlockId===b.id}
            onOpenVerse={openVerse} onActivate={onActivateBlock}/>
        ))}

        <button className="add-block">
          <Icons.Plus size={14}/>
          <span>Click to add a block, or type <span className="kbd">/</span> for menu</span>
        </button>

        {slashOpen && (
          <div className="slash-menu" style={{ top:slashPos.top, left:slashPos.left }}>
            <div style={{ padding:"4px 8px 6px 8px", borderBottom:"1px solid var(--line)", marginBottom:4 }}>
              <input autoFocus placeholder="Filter blocks…" value={slashFilter}
                onChange={e => { setSlashFilter(e.target.value); setSlashSel(0); }}
                onKeyDown={e => e.stopPropagation()}
                style={{ width:"100%", border:0, background:"transparent", outline:"none", fontSize:13, padding:"3px 0" }}/>
            </div>
            {filteredSlash.map((g,gi) => (
              <div key={g.group}>
                <div className="slash-section">{g.group}</div>
                {g.items.map((it, idx) => {
                  const flat = filteredSlash.slice(0,gi).reduce((a,gg)=>a+gg.items.length,0)+idx;
                  const IC = Icons[it.icon] || Icons.Text;
                  return (
                    <div key={it.id} className="slash-item" data-selected={slashSel===flat}
                      onMouseEnter={() => setSlashSel(flat)} onClick={() => setSlashOpen(false)}>
                      <div className="slash-item-icon"><IC size={15}/></div>
                      <div className="slash-item-text">
                        <div className="slash-item-name">{it.name}</div>
                        <div className="slash-item-desc">{it.desc}</div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
            {filteredSlash.length===0 && <div style={{ padding:"16px 10px", color:"var(--ink-3)", fontSize:13, textAlign:"center" }}>No blocks match "{slashFilter}"</div>}
          </div>
        )}

        {fmtBar && (
          <div className="format-bar" style={{ top:fmtBar.top, left:fmtBar.left }}>
            <button className="fb-btn" data-active={fmtBar.bold}   onMouseDown={e=>{e.preventDefault();exec("bold")}}><Icons.Bold size={14}/></button>
            <button className="fb-btn" data-active={fmtBar.italic} onMouseDown={e=>{e.preventDefault();exec("italic")}}><Icons.Italic size={14}/></button>
            <button className="fb-btn" data-active={fmtBar.under}  onMouseDown={e=>{e.preventDefault();exec("underline")}}><Icons.Underline size={14}/></button>
            <button className="fb-btn" onMouseDown={e=>{e.preventDefault();exec("strikeThrough")}}><Icons.Strike size={14}/></button>
            <div className="fb-sep"/>
            <button className="fb-btn" onMouseDown={e=>e.preventDefault()}><Icons.Code size={14}/></button>
            <button className="fb-btn" onMouseDown={e=>e.preventDefault()}><Icons.Link size={14}/></button>
          </div>
        )}
      </div>
    </div>
  );
}

// ============================================================
// DRAWER
// ============================================================
function Drawer({ openRef, onClose }) {
  const [tab, setTab] = useState("commentary");
  if (!openRef) return null;
  const data = COMMENTARY[openRef] || COMMENTARY["Q 1:1–7"];
  return (
    <div className="drawer-overlay" data-open={!!openRef}>
      <div className="drawer-head">
        <div style={{ flex:1, minWidth:0 }}>
          <div className="drawer-head-title">Tafsīr · Classical commentary</div>
          <div className="drawer-head-ref">{openRef} · Al-Fatiha</div>
        </div>
        <button className="drawer-close" title="Expand" onClick={()=>{}}><Icons.Expand size={14}/></button>
        <button className="drawer-close" onClick={onClose} title="Close"><Icons.Close size={14}/></button>
      </div>
      <div className="drawer-tabs">
        {["commentary","wbw","translations","audio"].map(t => (
          <button key={t} className="drawer-tab" data-active={tab===t} onClick={() => setTab(t)}>
            {{commentary:"Commentary",wbw:"Word-by-word",translations:"Translations",audio:"Recitation"}[t]}
          </button>
        ))}
      </div>
      <div className="drawer-body scroll">
        <div className="drawer-verse">
          <div className="drawer-verse-arabic">{data.verse.ar}</div>
          <div className="drawer-verse-translation"><i>{data.verse.tl}</i><br/>{data.verse.en}</div>
        </div>
        {tab==="commentary" && <>
          {data.sources.map((s,i) => (
            <div key={i} className="commentary-section">
              <div className="commentary-author">
                <div className="commentary-avatar">{s.initials}</div>
                <div style={{ minWidth:0 }}>
                  <div className="commentary-name">{s.author}</div>
                  <div className="commentary-sub">{s.years}</div>
                </div>
              </div>
              <div className="commentary-body">{s.body}</div>
            </div>
          ))}
          <div style={{ borderTop:"1px solid var(--line)", paddingTop:16, marginTop:8 }}>
            <button className="tb-btn" style={{ padding:"6px 12px", border:"1px solid var(--line-strong)" }}>
              <Icons.Plus size={13}/> Add source
            </button>
          </div>
        </>}
        {tab==="wbw" && (data.wbw
          ? <div className="wbw">{data.wbw.map((w,i)=><div key={i} className="wbw-cell"><div className="wbw-ar">{w.ar}</div><div className="wbw-tr">{w.tr}</div><div className="wbw-en">{w.en}</div></div>)}</div>
          : <div style={{ padding:20, textAlign:"center", color:"var(--ink-3)", fontSize:13 }}>Word-by-word breakdown not available for this range.</div>
        )}
        {tab==="translations" && <div className="lang-list">
          {[{name:"Saheeh International",sub:"EN · literal / clear",active:true},{name:"Abdel Haleem",sub:"EN · contemporary"},{name:"M.A.S. Pickthall",sub:"EN · early 20th c."},{name:"Yusuf Ali",sub:"EN · explanatory"},{name:"Hamidullah",sub:"FR · Hamidullah"}].map(t=>(
            <div key={t.name} className="lang-item" data-active={t.active}>
              <div><div className="lang-item-name">{t.name}</div><div className="lang-item-sub">{t.sub}</div></div>
              <Icons.Chevron size={14} style={{ color:"var(--ink-4)" }}/>
            </div>
          ))}
        </div>}
        {tab==="audio" && <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {[{name:"Mishary Rashid Alafasy",sub:"Kuwait · Ḥafṣ ʿan ʿĀṣim"},{name:"ʿAbd al-Bāsiṭ ʿAbd al-Ṣamad",sub:"Egypt · murattal"},{name:"Maher Al Muaiqly",sub:"Makkah · tarāwīḥ"}].map((r,i)=>(
            <div key={i} className="lang-item">
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                <button style={{ width:30, height:30, borderRadius:999, background:"var(--accent)", color:"white", display:"grid", placeItems:"center" }}><Icons.Play size={12}/></button>
                <div><div className="lang-item-name">{r.name}</div><div className="lang-item-sub">{r.sub}</div></div>
              </div>
              <span className="lang-item-sub">0:12</span>
            </div>
          ))}
        </div>}
      </div>
    </div>
  );
}

// ============================================================
// TWEAKS
// ============================================================
function Tweaks({ state, onChange, onClose }) {
  return (
    <div className="tweaks-panel">
      <div className="tweaks-head">
        <div className="tweaks-title">Tweaks</div>
        <button className="tweaks-close" onClick={onClose}><Icons.Close size={13}/></button>
      </div>
      <div className="tweaks-body">
        <div className="tw-row">
          <div className="tw-label">Theme</div>
          <div className="tw-segments">
            {["light","dark"].map(v=><button key={v} className="tw-seg" data-active={state.theme===v} onClick={()=>onChange({theme:v})}>{v==="light"?"Paper":"Slate"}</button>)}
          </div>
        </div>
        <div className="tw-row">
          <div className="tw-label">Accent</div>
          <div className="tw-swatches">
            {[{id:"emerald",color:"oklch(0.55 0.08 160)"},{id:"amber",color:"oklch(0.62 0.11 70)"},{id:"indigo",color:"oklch(0.52 0.12 275)"}].map(a=>(
              <button key={a.id} className="tw-swatch" data-active={state.accent===a.id} onClick={()=>onChange({accent:a.id})} title={a.id}>
                <span className="tw-swatch-dot" style={{ background:a.color }}/>
              </button>
            ))}
          </div>
        </div>
        <div className="tw-row">
          <div className="tw-label">Density</div>
          <div className="tw-segments">
            {["compact","cozy","roomy"].map(v=><button key={v} className="tw-seg" data-active={state.density===v} onClick={()=>onChange({density:v})}>{v[0].toUpperCase()+v.slice(1)}</button>)}
          </div>
        </div>
        <div className="tw-row">
          <div className="tw-label">Canvas width</div>
          <div className="tw-segments">
            {["focused","wide"].map(v=><button key={v} className="tw-seg" data-active={state.canvasWidth===v} onClick={()=>onChange({canvasWidth:v})}>{v[0].toUpperCase()+v.slice(1)}</button>)}
          </div>
        </div>
        <div className="tw-row">
          <div className="tw-label">Drawer blur</div>
          <div className="tw-segments">
            {["light","medium","heavy"].map(v=><button key={v} className="tw-seg" data-active={state.glass===v} onClick={()=>onChange({glass:v})}>{v[0].toUpperCase()+v.slice(1)}</button>)}
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// APP
// ============================================================
const DEFAULTS = { theme:"light", accent:"emerald", density:"cozy", canvasWidth:"focused", glass:"light" };

function App() {
  const [tw, setTw] = useState(() => {
    try { const s = localStorage.getItem("tafsirlab.tweaks"); if (s) return { ...DEFAULTS, ...JSON.parse(s) }; } catch {}
    return DEFAULTS;
  });
  const updateTw = patch => setTw(prev => {
    const next = { ...prev, ...patch };
    try { localStorage.setItem("tafsirlab.tweaks", JSON.stringify(next)); } catch {}
    return next;
  });

  const [showTweaks, setShowTweaks] = useState(false);
  const [activePage, setActivePage] = useState("p-names");
  const [drawerRef, setDrawerRef]   = useState(null);
  const [activeBlockId, setActiveBlockId] = useState(null);

  const openVerse = ref => setDrawerRef(ref);
  const closeDrawer = () => setDrawerRef(null);
  const doc = useMemo(() => buildDoc(openVerse), []);

  return (
    <div className="app" data-theme={tw.theme} data-accent={tw.accent} data-density={tw.density} data-canvas={tw.canvasWidth} data-glass={tw.glass}>
      <Rail active="notes" onSelect={()=>{}}/>
      <Sidebar activeId={activePage} onSelect={setActivePage}/>
      <main className="canvas scroll">
        <div className="topbar">
          <div className="crumbs">
            <span className="crumb">Tafsir Scholars</span>
            <span className="crumb-sep">/</span>
            <span className="crumb">Quranic Studies</span>
            <span className="crumb-sep">/</span>
            <span className="crumb">Surah Al-Fatiha</span>
            <span className="crumb-sep">/</span>
            <span className="crumb" data-current="true">Names of the Surah</span>
          </div>
          <div className="topbar-actions">
            <button className="tb-icon" title="Comments"><Icons.Comment size={15}/></button>
            <button className="tb-icon" title="History"><Icons.History size={15}/></button>
            <button className="tb-icon" title="Copy link"><Icons.Link size={15}/></button>
            <div className="tb-divider"/>
            <button className="tb-btn" data-active={showTweaks} onClick={() => setShowTweaks(v=>!v)} title="Tweaks">
              <Icons.Sliders size={14}/> Tweaks
            </button>
            <button className="tb-btn" data-active={!!drawerRef} onClick={() => setDrawerRef(drawerRef ? null : "Q 1:1–7")} title="Toggle tafsīr">
              <Icons.Book size={14}/> Tafsīr
            </button>
            <button className="tb-share" title="Share"><Icons.Share size={13}/> Share</button>
          </div>
        </div>
        <Editor doc={doc} openVerse={openVerse} activeVerseRef={drawerRef} activeBlockId={activeBlockId} onActivateBlock={setActiveBlockId}/>
      </main>
      <Drawer openRef={drawerRef} onClose={closeDrawer}/>
      {showTweaks && <Tweaks state={tw} onChange={updateTw} onClose={() => setShowTweaks(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
