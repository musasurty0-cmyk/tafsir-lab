<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ══════════════════════════════════════════════════════════════════
         labai-live — 11.5s square announcement reel.
         Recreates the beat order and seam grammar of the analysed reference
         (ledger.json) in TafsirLab's own brand. No reference assets carried.

         Wrapper discipline: every animated group is  .fx > .mv > content —
         blur tweens ride .fx, transform/opacity tweens ride .mv, so blur and
         transforms never share an element (headless compositing), and no CSS
         transform ever collides with a GSAP tween (lint:
         gsap_css_transform_conflict). Centring is flex, never translate.
         ══════════════════════════════════════════════════════════════════ */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --ink-0: #07080a;
        --ink-1: #0d0f12;
        --ink-2: #16191d;
        --paper: #f6f5f2;
        --fg: #f6f5f2;
        --fg-dim: #a7a29b;
        --accent: #4f9a7a;
        --accent-deep: #3c7a60;
        --highlight: #f2e3a4;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
                system-ui, "Helvetica Neue", Arial, sans-serif;
        --serif: Georgia, "Times New Roman", serif;
      }

      html, body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink-0);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }

      /* Opaque stage ground — the mid-window cut's white-flash guard. */
      #root {
        position: relative;
        width: 1080px;
        height: 1080px;
        background: var(--ink-0);
      }

      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* ── Grounds ─────────────────────────────────────────────────────── */
      .ground { position: absolute; inset: 0; background: var(--ink-0); }
      .ground--paper { background: var(--paper); }
      /* The dawn: deep ink sky over a green-gold horizon. */
      .dawn {
        position: absolute; inset: 0;
        background:
          radial-gradient(140% 90% at 50% 118%, rgba(242, 227, 164, 0.32), transparent 55%),
          radial-gradient(160% 100% at 50% 112%, rgba(79, 154, 122, 0.5), transparent 62%),
          linear-gradient(180deg, #07080a 0%, #0a0f10 55%, #12241d 100%);
      }

      .fx { position: absolute; inset: 0; }
      .mv { position: absolute; inset: 0; }

      /* ── Scene: ident ────────────────────────────────────────────────── */
      #id-glyph-fx { inset: auto; left: 150px; top: 240px; width: 150px; height: 150px; }
      #id-glyph-mv { inset: 0; }
      .id-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .wordmark {
        font-family: var(--serif);
        font-size: 96px;
        font-weight: 600;
        letter-spacing: -0.015em;
        color: var(--fg);
      }

      /* ── Scene: composer ─────────────────────────────────────────────── */
      .cp-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .composer {
        width: 880px;
        background: rgba(18, 21, 24, 0.94);
        border: 1px solid rgba(246, 245, 242, 0.07);
        border-radius: 30px;
        padding: 52px 48px 40px;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.5);
      }
      .prompt {
        font-size: 40px;
        font-weight: 500;
        line-height: 1.35;
        color: var(--fg);
        min-height: 116px;
      }
      .prompt .ch { display: inline; }
      .caret {
        display: inline-block;
        width: 4px; height: 42px;
        background: var(--accent);
        vertical-align: -6px;
        margin-left: 4px;
      }
      .cp-row {
        display: flex; align-items: center; gap: 16px;
        margin-top: 40px;
      }
      .chip {
        display: inline-flex; align-items: center; justify-content: center;
        height: 62px; padding: 0 26px;
        border: 1.5px solid rgba(246, 245, 242, 0.18);
        border-radius: 999px;
        color: var(--fg-dim);
        font-size: 24px; font-weight: 500;
        gap: 10px;
      }
      .chip--round { width: 62px; padding: 0; font-size: 30px; }
      .send {
        margin-left: auto;
        width: 72px; height: 72px;
        border-radius: 50%;
        background: var(--accent);
        display: flex; align-items: center; justify-content: center;
        position: relative;
      }
      .send svg { width: 34px; height: 34px; }
      .badge {
        position: absolute; right: -76px; top: 4px;
        width: 62px; height: 62px; border-radius: 50%;
        background: var(--paper);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
      }
      .badge svg { width: 34px; height: 34px; }

      .cursor {
        position: absolute;
        /* CSS holds the FINAL pose (tip on the send button); all motion is
           x/y transform offsets from here — layout properties snap to device
           pixels under seek-by-frame capture. */
        left: 64.8%; top: 63.5%;
        width: 120px; height: 120px;
        z-index: 20;
        filter: drop-shadow(0 5px 8px rgba(0, 0, 0, 0.35));
        pointer-events: none;
        will-change: transform;
      }

      /* ── Scenes: mark / capsule / pill ───────────────────────────────── */
      .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .mark-badge {
        width: 180px; height: 180px; border-radius: 50%;
        background: var(--ink-1);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 30px 60px rgba(7, 8, 10, 0.18);
      }
      .mark-badge svg { width: 92px; height: 92px; }

      .cap {
        width: 180px; height: 150px;
        border-radius: 999px;
        background: var(--ink-1);
        display: flex; align-items: center; justify-content: center;
        gap: 20px;
        overflow: hidden;
        white-space: nowrap;
        box-shadow: 0 30px 60px rgba(7, 8, 10, 0.16);
      }
      .cap svg { width: 56px; height: 56px; flex: none; }
      .cap-label {
        display: inline-flex; gap: 18px;
        font-size: 46px; font-weight: 800; letter-spacing: 0.02em;
        color: var(--paper);
      }
      .cap-label .w { display: inline-block; }

      .cap--light {
        width: 620px;
        background: var(--paper);
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
      }
      .cap--light .cap-label { color: var(--ink-1); font-style: italic; font-size: 54px; }

      /* ── Scene: live ─────────────────────────────────────────────────── */
      .type-row {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        gap: 34px;
        font-size: 128px; font-weight: 900; font-style: italic;
        letter-spacing: -0.01em;
        color: var(--fg);
        z-index: 5;
      }
      .type-row .tw { display: inline-block; }
      .live-word {
        background: linear-gradient(92deg, var(--accent) 10%, var(--highlight) 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding-right: 10px; /* italic overhang — keep the E's clip inside the box */
      }

      .card {
        position: absolute;
        width: 330px;
        background: #fbfaf7;
        border-radius: 16px;
        box-shadow: 0 24px 50px rgba(4, 6, 8, 0.45);
        overflow: hidden;
      }
      .card-page { padding: 18px 18px 14px; background: #ffffff; }
      .card-head {
        height: 16px; width: 62%;
        border-radius: 4px;
        background: var(--accent);
        opacity: 0.85;
        margin-bottom: 12px;
      }
      .card-line { height: 9px; border-radius: 3px; background: #e3e0d8; margin-bottom: 8px; }
      .card-line:nth-child(3) { width: 92%; }
      .card-line:nth-child(4) { width: 78%; }
      .card-line:nth-child(5) { width: 86%; margin-bottom: 0; }
      .card-meta {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 18px;
      }
      .card-ini {
        width: 40px; height: 40px; border-radius: 50%;
        background: var(--ink-2); color: var(--paper);
        display: flex; align-items: center; justify-content: center;
        font-size: 17px; font-weight: 700;
        flex: none;
      }
      .card-name { font-size: 21px; font-weight: 650; color: #1c1f22; line-height: 1.15; }
      .card-sub  { font-size: 16px; color: #8a857c; margin-top: 2px; }

      /* ── Scene: close ────────────────────────────────────────────────── */
      .close-stack {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px;
      }
      .close-stack svg { width: 72px; height: 72px; }
      .close-word {
        font-family: var(--serif);
        font-size: 92px; font-weight: 600; letter-spacing: -0.012em;
        color: #16181b;
      }
      .close-rule {
        width: 210px; height: 5px; border-radius: 3px;
        background: var(--accent);
      }
    </style>
  </head>

    <script>
      // Split the prompt into per-character spans (deterministic, build-time).
      const PROMPT = "what does ibn kathir say about the basmalah";
      const promptEl = document.getElementById("prompt");
      const caret = document.getElementById("caret");
      const chars = [];
      for (const c of PROMPT) {
        const s = document.createElement("span");
        s.className = "ch";
        s.textContent = c;
        promptEl.insertBefore(s, caret);
        chars.push(s);
      }

      const tl = gsap.timeline({ paused: true });

      /* ── Build-time hidden states (seek-safe: set once, reveal with to()) */
      gsap.set(chars, { autoAlpha: 0 });
      gsap.set("#wm-fx", { autoAlpha: 0 });
      gsap.set("#badge", { autoAlpha: 0 });
      gsap.set("#cap-spark", { autoAlpha: 0 });
      gsap.set("#cap-label .w", { autoAlpha: 0 });
      gsap.set("#lv-cards .card", { autoAlpha: 0 });
      gsap.set("#lv-dawn", { autoAlpha: 0 });
      gsap.set("#cl-rule", { scaleX: 0, transformOrigin: "left center" });

      /* ═══ 1 · IDENT ═══════════════════════════════════════════════════ */
      // Glyph enters the room: one continuous decelerating vector, defocus→sharp.
      tl.fromTo("#id-glyph-mv", { x: -80, y: 150, scale: 0.9 },
        { x: 0, y: 0, scale: 1, duration: 1.6, ease: "expo.out" }, 0.05);
      tl.fromTo("#id-glyph-fx", { filter: "blur(24px)" },
        { filter: "blur(0px)", duration: 1.25, ease: "power2.out" }, 0.05);
      // Dawn wakes underneath.
      tl.fromTo("#id-dawn", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 1.6, ease: "sine.out" }, 0.7);
      // Wordmark blur-in (fade_blur), slightly rising.
      tl.to("#wm-fx", { autoAlpha: 1, duration: 0.55, ease: "power2.out" }, 1.75);
      tl.fromTo("#wm-fx", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, 1.75);
      tl.fromTo("#wm-mv", { y: 26 }, { y: 0, duration: 0.6, ease: "power3.out" }, 1.75);

      // SEAM 1 (t=2.8, Z push): exit grows into the cut — zoom-through.
      tl.to("#id-content", { scale: 1.2, duration: 0.2, ease: "power3.in" }, 2.6);
      tl.to("#id-fx", { filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, 2.6);
      tl.to("#id-content", { opacity: 0.15, duration: 0.2, ease: "none" }, 2.6);

      /* ═══ 2 · COMPOSER ════════════════════════════════════════════════ */
      // Entry keeps growing (0.78→1): same Z sign as the exit — the cut is
      // mid-push on both sides.
      tl.fromTo("#cp-mv", { scale: 0.78, opacity: 0.15 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 2.8);
      tl.fromTo("#cp-fx", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 2.8);

      // Typing: stepped per-character reveal (43 sets — binary, seek-safe).
      chars.forEach((c, i) => tl.set(c, { autoAlpha: 1 }, 3.06 + i * 0.021));
      // Caret blinks while typing (finite), then goes out before the click.
      tl.to("#caret", { autoAlpha: 0, duration: 0.28, repeat: 4, yoyo: true, ease: "none" }, 3.0);
      tl.set("#caret", { autoAlpha: 0 }, 4.35);

      // The badge pops in beside send — scale_punch, announced before the click.
      tl.to("#badge", { autoAlpha: 1, duration: 0.12, ease: "none" }, 4.14);
      tl.fromTo("#badge", { scale: 0.4 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, 4.14);

      // Cursor: physical entry from below, one vector, tip toward send.
      // Offsets from the CSS final pose: start ≈ (46%, 112%) of the canvas.
      tl.fromTo("#cursor", { x: -203, y: 524 },
        { x: -14, y: 27, duration: 0.75, ease: "power3.out" }, 3.3);
      tl.to("#cursor", { x: 0, y: 0, duration: 0.3, ease: "power2.out" }, 4.05);
      // Click at 4.42 — asymmetric tap, target reacts same-frame.
      tl.to("#cursor", { scale: 0.84, duration: 0.1, ease: "power2.in", transformOrigin: "21% 14%" }, 4.42);
      tl.to("#cursor", { scale: 1, duration: 0.22, ease: "power2.out", transformOrigin: "21% 14%" }, 4.52);
      tl.to("#send", { scale: 0.92, duration: 0.1, ease: "power2.in" }, 4.42);
      tl.to("#send", { scale: 1, duration: 0.22, ease: "power2.out" }, 4.52);

      // SEAM 2 (t=4.7, Z pull, caused by the click): the click's recoil sends
      // the composer AWAY — shrinking, blurring — matching the incoming mark's
      // shrink-settle. Same-frame ignition: recoil starts on the release.
      tl.to("#cp-mv", { scale: 0.9, duration: 0.22, ease: "power3.in" }, 4.48);
      tl.to("#cp-fx", { filter: "blur(14px)", duration: 0.22, ease: "power3.in" }, 4.48);
      tl.to("#cp-mv", { opacity: 0.15, duration: 0.22, ease: "none" }, 4.48);
      tl.to("#cursor", { y: 70, duration: 0.22, ease: "power2.in" }, 4.48);

      /* ═══ 3 · MARK ════════════════════════════════════════════════════ */
      // Arrival: oversized, shrinking into the focal plane (pull sign held).
      tl.fromTo("#mk-mv", { scale: 1.18 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 4.7);
      tl.fromTo("#mk-fx", { filter: "blur(8px)" }, { filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, 4.7);
      // 5.2–5.5: stillness before the stretch — the dramatic comma.

      /* ═══ 4 · CAPSULE ═════════════════════════════════════════════════ */
      // The circle stretches into a labelled pill.
      tl.to("#cap", { width: 620, duration: 0.45, ease: "back.out(1.3)" }, 5.52);
      tl.to("#cap-spark", { autoAlpha: 1, duration: 0.1, ease: "none" }, 5.62);
      tl.fromTo("#cap-spark", { scale: 0.5 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 5.62);
      // Label: waterfall ENTRY (§6) — binary alpha, y-cascade, weight-varied.
      tl.set("#cap-label .w", { autoAlpha: 1 }, 5.92);
      tl.fromTo("#cap-label .w:nth-child(1)", { y: 62 }, { y: 0, duration: 0.18, ease: "power4.out" }, 5.92);
      tl.fromTo("#cap-label .w:nth-child(2)", { y: 48 }, { y: 0, duration: 0.14, ease: "power4.out" }, 6.03);
      tl.fromTo("#cap-label .w:nth-child(3)", { y: 40 }, { y: 0, duration: 0.12, ease: "power4.out" }, 6.12);

      // SEAM 3 (t=6.5, match-cut): slow push drift into the cut; the capsule
      // geometry is the carrier — same rect, colors invert, label swaps.
      tl.to("#cap-mv", { scale: 1.045, duration: 0.2, ease: "power1.in" }, 6.3);

      /* ═══ 5 · PILL ════════════════════════════════════════════════════ */
      // Velocity carries through the cut (push continues), then settles.
      tl.fromTo("#pl-mv", { scale: 1.045 }, { scale: 1.09, duration: 0.1, ease: "none" }, 6.5);
      tl.to("#pl-mv", { scale: 1, duration: 0.3, ease: "expo.out" }, 6.6);

      // SEAM 4 (t=7.3, X left — the current): partial travel, early fade
      // timed to die at the cut.
      tl.to("#pl-mv", { x: -130, duration: 0.3, ease: "power4.in" }, 7.0);
      tl.to("#pl-mv", { opacity: 0, duration: 0.2, ease: "none" }, 7.09);
      tl.set("#pl-mv", { opacity: 0 }, 7.3); // hard kill at the boundary (seek-safe)

      /* ═══ 6 · LIVE ════════════════════════════════════════════════════ */
      // Entry continues leftward at matched velocity, igniting mid-path.
      tl.fromTo("#type-row", { x: 130 }, { x: 0, duration: 0.34, ease: "power4.out" }, 7.3);
      tl.fromTo("#type-row", { opacity: 0.35 }, { opacity: 1, duration: 0.25, ease: "none" }, 7.3);

      // 8.05: IS + NOW leave; LIVE nudges to centre (§7 three-phase curve).
      tl.to(["#tw-is", "#tw-now"], { x: -110, duration: 0.3, ease: "power3.in" }, 8.05);
      tl.to(["#tw-is", "#tw-now"], { autoAlpha: 0, duration: 0.24, ease: "none" }, 8.08);
      tl.to("#tw-live", { x: -19, duration: 0.09, ease: "power3.in" }, 8.05);   // ramp ~10%
      tl.to("#tw-live", { x: -142, duration: 0.08, ease: "none" }, 8.14);       // burst ~65%
      tl.to("#tw-live", { x: -189, duration: 0.28, ease: "power4.out" }, 8.22); // tail ~25%

      // Dawn rises during the burst (reveals masked by motion).
      tl.to("#lv-dawn", { autoAlpha: 1, duration: 0.9, ease: "sine.inOut" }, 8.15);
      tl.fromTo("#lv-dawn-mv", { y: 90 }, { y: 0, duration: 1.0, ease: "power2.out" }, 8.15);

      // The wall: cards float up in, staggered, then keep drifting (parallax) —
      // still mid-flight at the seam.
      const cards = ["#card-1", "#card-2", "#card-3", "#card-4", "#card-5"];
      const drift = [-64, -46, -58, -40, -72];
      cards.forEach((id, i) => {
        const t0 = 8.4 + i * 0.14;
        tl.fromTo(id, { y: 180 }, { y: 30, duration: 0.55, ease: "power3.out" }, t0);
        tl.to(id, { autoAlpha: 1, duration: 0.3, ease: "none" }, t0);
        tl.to(id, { y: 30 + drift[i], duration: 10.3 - (t0 + 0.55), ease: "none" }, t0 + 0.55);
      });

      // SEAM 5 (t=10.3, Y up): everything accelerates upward out; fade dies
      // at the cut.
      tl.to("#lv-content", { y: -130, duration: 0.3, ease: "power4.in" }, 10.0);
      tl.to("#lv-content", { opacity: 0, duration: 0.2, ease: "none" }, 10.09);
      tl.set("#lv-content", { opacity: 0 }, 10.3); // hard kill at the boundary

      /* ═══ 7 · CLOSE ═══════════════════════════════════════════════════ */
      // Entry continues upward at matched velocity onto the light ground.
      tl.fromTo("#cl-mv", { y: 130 }, { y: 0, duration: 0.4, ease: "power4.out" }, 10.3);
      tl.fromTo("#cl-mv", { opacity: 0.35 }, { opacity: 1, duration: 0.28, ease: "none" }, 10.3);
      tl.to("#cl-rule", { scaleX: 1, duration: 0.35, ease: "expo.out" }, 10.85);
      // Hold to 11.5.

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
