    <style>
      /* everything-you-do — 63.6s, 1080×1920, LIGHT. TafsirLab × SGS ISOC. Generated by build.py; edit the data, not this. */
* { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        /* The app's own LIGHT tokens (app/globals.css). Green excluded per
           the owner's standing brief; the accent here is the app's ochre. */
        --bg:     #fcfbf8;
        --ink:    #292621;
        --ink-2:  #57534b;
        --ink-3:  #6e695f;
        --rest:   #7e7a6f;   /* a word not yet spoken — 3.9:1 on paper */
        --line:   rgba(41, 38, 33, 0.13);
        --accent: #a8762a;

        --sans:   "Inter", -apple-system, "Segoe UI", system-ui, Arial, sans-serif;
        /* Literata, not Source Serif 4. Same family of idea — a face built for
           long-form reading on a warm ground — but shorter in the ascender,
           sturdier in the stem, and it carries weight 700 without going
           spindly in the thin strokes the way a higher-contrast serif does.
           The words are the picture here, so they should have some mass. */
        --serif:  "Literata", "Source Serif 4", Georgia, serif;
        /* The wordmark stays in the app's own face: the mark is brand truth
           and it has to match the other reel, whatever the captions are set
           in. */
        --brand:  "Source Serif 4", Georgia, serif;
        --arabic: "Scheherazade New", "Amiri", serif;
      }

      html, body {
        width: 1080px; height: 1920px;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root { position: relative; width: 1080px; height: 1920px; background: var(--bg); }
      .clip { position: absolute; inset: 0; overflow: hidden; }

      /* ── The surface ────────────────────────────────────────────────── */
      .paper { position: absolute; inset: 0; background: var(--bg); }
      .dots {
        position: absolute; inset: 0;
        background: radial-gradient(rgba(41, 38, 33, 0.09) 1.5px, transparent 1.5px);
        background-size: 30px 30px;
        /* STATIC. A drifting grid under 80px serif re-rasterises the glyphs
           every frame and reads as vibration — this project has paid for
           that bug twice. Nothing in the background moves. */
      }

      /* ── The rail: a hairline that fills as he speaks ─────────────────── */
      .rail {
        position: absolute; left: 96px; right: 96px; top: 352px;
        display: flex; align-items: center;
      }
      .rail-track { position: relative; flex: 1; height: 2px; background: var(--line); }
      .rail-fill {
        position: absolute; inset: 0;
        background: var(--accent); opacity: 0.55;
        transform-origin: 0% 50%; transform: scaleX(0);
      }

      /* ── The caption stage ──────────────────────────────────────────── */
      .stage {
        position: absolute; left: 90px; right: 90px; top: 620px; height: 700px;
      }
      .beat {
        position: absolute; left: 0; right: 0; top: 50%;
        transform: translateY(-50%);
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        text-align: center;
        opacity: 0;
      }
      /* .bmv carries the roll; .beat keeps the centring transform, so the two
         never fight over the same transform matrix. */
      .bmv { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

      .ln {
        font-family: var(--serif); font-weight: 700; font-size: 76px;
        line-height: 1.26; letter-spacing: -0.022em;
        max-width: 900px;
      }
      /* Literata sets wider and with a taller x-height than Source Serif 4,
         so every size comes down ~7% to hold the same line breaks while
         reading heavier. */
      .ln--xl   { font-size: 96px;  line-height: 1.18; }
      .ln--sm   { font-size: 66px; }
      .ln--face { font-size: 122px; line-height: 1.1; }
      .ln--held { font-size: 110px; line-height: 1.1; }

      /* A word. .w takes layout + entrance transforms, .wi takes the ink the
         karaoke driver writes — one property each, so nothing is overwritten
         from two places. */
      .w  { display: inline-block; }
      .wi { display: inline-block; color: var(--rest); }

      /* The ochre marker: a child of the marked run, so it needs no measuring
         and cannot drift off the words it belongs to. */
      .mk { position: relative; display: inline-block; }
      .mk-bar {
        position: absolute; left: -4px; right: -4px; bottom: 2px; height: 6px;
        background: var(--accent); opacity: 0.42;
        transform-origin: 0% 50%; transform: scaleX(0);
      }

      /* ── The Arabic heroes ──────────────────────────────────────────── */
      .hero-ar {
        font-family: var(--arabic); font-weight: 700; font-size: 150px;
        line-height: 1.5; color: var(--ink); direction: rtl;
      }
      .hero-ar--long { font-size: 122px; }
      .hero-rule {
        width: 420px; height: 3px; background: var(--accent); opacity: 0.5;
        margin: 6px 0 20px; transform-origin: 50% 50%; transform: scaleX(0);
      }
      .hero-tr {
        font-family: var(--serif); font-style: italic; font-weight: 600;
        font-size: 42px; color: var(--ink-2); letter-spacing: -0.01em;
      }
      .hero-en {
        font-family: var(--serif); font-weight: 400; font-size: 36px;
        color: var(--ink-3); margin-top: 6px;
      }

      /* ── The closing card ───────────────────────────────────────────── */
      .brand-row { display: flex; align-items: center; gap: 34px; }
      .tile {
        width: 148px; height: 148px; border-radius: 34px;
        background: var(--ink);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 26px 60px rgba(41, 38, 33, 0.22);
      }
      .tile .t {
        font-family: var(--brand); font-style: normal; font-weight: 600;
        font-size: 92px; line-height: 1; color: var(--bg); padding-bottom: 8px;
      }
      .wordmark {
        font-family: var(--brand); font-style: italic; font-weight: 500;
        font-size: 108px; letter-spacing: -0.02em; color: var(--ink);
        white-space: nowrap;
      }
      /* Both reveals are clips, not fades. Fading a child inside a group that
         is itself fading compounds the two, and a half-opaque glyph measures
         as a contrast failure mid-entrance even though its resting state is
         13:1. A clip slides at full ink the whole way. */
      .wm-clip  { overflow: hidden; padding: 6px 0; }
      .url-clip { overflow: hidden; }
      /* The same ochre rule the two Arabic cards drew under their phrase —
         the close rhymes with them rather than introducing a new device. */
      .close-rule {
        width: 360px; height: 3px; background: var(--accent); opacity: 0.5;
        margin: 40px 0 22px; transform-origin: 50% 50%; transform: scaleX(0);
      }
      .close-url {
        font-family: var(--sans); font-size: 30px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
      }

      /* ── The running foot ───────────────────────────────────────────── */
      .foot {
        position: absolute; left: 96px; right: 96px; top: 1478px;
        display: flex; align-items: center; justify-content: space-between;
        font-family: var(--sans); font-size: 24px; font-weight: 500;
        letter-spacing: 0.1em; text-transform: uppercase; color: #8a8579;
        padding-top: 22px; border-top: 1px solid var(--line);
        opacity: 0;
      }

      /* ── The co-brand ─────────────────────────────────────────── */
      /* Two organisations, stacked rather than strung across one line: set
         side by side they run past 1000px and the lockup stops reading as a
         pairing and starts reading as a sentence. The cross is ochre and
         small — it joins the two names without competing with either. */
      .cobrand { display: flex; align-items: center; gap: 22px; margin-top: 26px; }
      .xm {
        font-family: var(--serif); font-weight: 400; font-size: 46px;
        color: var(--accent); opacity: 0.8; line-height: 1;
      }
      .sgs {
        font-family: var(--sans); font-weight: 600; font-size: 54px;
        letter-spacing: 0.06em; color: var(--ink); white-space: nowrap;
      }
      .sgs-clip { overflow: hidden; padding: 6px 0; }

      /* ── The book ────────────────────────────────────────────── */
      /* Drawn, not illustrated: the same hairline weight as the rules and the
         same ochre as the marker, so it belongs to the page rather than
         arriving from a different stylesheet. It lives ABOVE the caption
         stage as its own element, because the three captions underneath it
         change while it is open and a graphic inside a beat would leave with
         the first of them. */
      .bookwrap {
        position: absolute; left: 0; right: 0; top: 386px;
        display: flex; justify-content: center;
        opacity: 0;
      }
      .bk-cover { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: round; }
      .bk-spine { stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }
      .bk-lines line { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; opacity: 0.42; }

      /* ── The drawn marks ──────────────────────────────────────── */
      /* He is listing — salah, prayers, fasting, hajj — so the screen lists
         too, one mark per item, instead of setting four nouns as a paragraph.
         Same hairline ink and same ochre as the book, so the drawn things in
         this film read as one set rather than as clip art. */
      .icons { display: flex; align-items: flex-start; justify-content: center; gap: 40px; margin-top: 44px; }
      .ic { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .ic-ink { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .ic-acc { fill: none; stroke: var(--accent); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .ic-label { font-family: var(--serif); font-weight: 700; font-size: 46px; letter-spacing: -0.015em; }
    </style>

        [58.48, 58.74, "everything"], [58.74, 58.86, "you"], [58.86, 59.17, "do."],
      ];

      /* The Arabic he recites, word by word. Same shape as WORDS and driven
         by the same envelope: the recitation is what animates these cards. */
      const AR = [
        [0.85, 1.69, "الْعِبَادَةُ"], [1.69, 3.65, "لَا"], [3.65, 4.41, "تُسَمَّى"],
        [4.41, 6.35, "عِبَادَةً"], [6.35, 7.63, "إِلَّا"], [7.63, 8.15, "مَعَ"],
        [8.15, 8.91, "التَّوْحِيدِ"], [11.70, 11.80, "لَا"], [11.80, 12.04, "إِلَٰهَ"],
        [12.04, 12.26, "إِلَّا"], [12.26, 12.80, "اللَّهُ"], [23.06, 23.32, "إِنَّمَا"],
        [23.32, 23.76, "الْأَعْمَالُ"], [23.76, 24.70, "بِالنِّيَّاتِ"], [28.28, 28.78, "وَإِنَّمَا"],
        [28.78, 29.14, "لِكُلِّ"], [29.14, 29.40, "امْرِئٍ"], [29.40, 29.64, "مَا"],
        [29.64, 30.20, "نَوَى"],
      ];
      const AR_LINES = [
        { host: "#ha1-ar", range: [0, 6] },
        { host: "#hla-ar", range: [7, 10] },
        { host: "#h1-ar", range: [11, 13] },
        { host: "#h2-ar", range: [14, 18] },
      ];

      /* Which words sit on which line. `range` is inclusive and indexes
         WORDS, so a caption can never say one thing while the driver lights
         another. `mark` is the sub-range the ochre bar underlines. */
      const LINES = [
        { beat: "b1", cls: "ln ln--sm", range: [0, 4] },
        { beat: "b1", cls: "ln ln--sm", range: [5, 8] },
        { beat: "s1", cls: "ln ln--sm", range: [15, 19] },
        { beat: "s1", cls: "ln ln--sm", range: [20, 25] },
        { beat: "s1", cls: "ln ln--sm", range: [26, 27] },
        { beat: "s2", cls: "ln ln--sm", range: [28, 29] },
        { beat: "s2", cls: "ln ln--sm", range: [30, 33] },
        { beat: "s2", cls: "ln ln--sm", range: [34, 37] },
        { beat: "s3", cls: "ln ln--sm", range: [38, 40] },
        { beat: "s3", cls: "ln ln--sm", range: [41, 44] },
        { beat: "d1", cls: "ln", range: [45, 53], mark: [51, 53] },
        { host: "#icl-d2-salah", cls: "ic-label", range: [64, 64] },
        { host: "#icl-d2-beads", cls: "ic-label", range: [67, 67] },
        { host: "#icl-d2-crescent", cls: "ic-label", range: [70, 70] },
        { host: "#icl-d2-kaaba", cls: "ic-label", range: [73, 73] },
        { beat: "d2", cls: "ln ln--sm", range: [56, 61] },
        { beat: "d3", cls: "ln ln--sm", range: [74, 78] },
        { beat: "d3", cls: "ln ln--sm", range: [79, 83] },
        { beat: "d3", cls: "ln ln--sm", range: [84, 87] },
        { beat: "d4", cls: "ln", range: [88, 91] },
        { beat: "d4", cls: "ln", range: [92, 99], mark: [99, 99] },
        { beat: "d5", cls: "ln ln--sm", range: [100, 103], mark: [103, 103] },
        { beat: "d5", cls: "ln ln--sm", range: [104, 108] },
        { beat: "d6", cls: "ln ln--sm", range: [109, 113] },
        { beat: "d6", cls: "ln ln--sm", range: [114, 116] },
        { beat: "d6", cls: "ln ln--sm", range: [117, 119] },
        { beat: "d6", cls: "ln ln--sm", range: [120, 125], mark: [124, 125] },
        { beat: "f1", cls: "ln ln--xl", range: [126, 131] },
      ];

      const BEATS = [
        { el: "#ha1", from:   0.00, to:   9.19, enter: "hero" },
        { el: "#b1", from:   9.19, to:  11.60, enter: "rise" },
        { el: "#hla", from:  11.60, to:  13.14, enter: "hero" },
        { el: "#s1", from:  13.14, to:  17.10, enter: "fast" },
        { el: "#s2", from:  17.10, to:  20.50, enter: "side" },
        { el: "#s3", from:  20.50, to:  23.00, enter: "rise" },
        { el: "#h1", from:  23.00, to:  28.00, enter: "hero" },
        { el: "#h2", from:  28.00, to:  33.85, enter: "hero" },
        { el: "#d1", from:  33.85, to:  37.18, enter: "side" },
        { el: "#d2", from:  37.18, to:  44.26, enter: "rise" },
        { el: "#d3", from:  44.26, to:  48.05, enter: "fast" },
        { el: "#d4", from:  48.05, to:  50.86, enter: "tilt" },
        { el: "#d5", from:  50.86, to:  53.38, enter: "side" },
        { el: "#d6", from:  53.38, to:  57.60, enter: "rise" },
        { el: "#f1", from:  57.60, to:  59.60, enter: "slam" },
        { el: "#close", from:  59.60, to:  63.60, enter: "rise" },
      ];

      const DUR = 63.60;
      const SPEECH_END = 59.17;
      const tl = gsap.timeline({ paused: true });

      const stage = document.getElementById("stage");
      const wordEls = new Array(WORDS.length).fill(null);

      function makeWord(i) {
        const outer = document.createElement("span");
        outer.className = "w";
        const inner = document.createElement("i");
        inner.className = "wi";
        inner.style.fontStyle = "normal";
        inner.textContent = WORDS[i][2];
        outer.appendChild(inner);
        wordEls[i] = inner;
        return outer;
      }

      const arEls = new Array(AR.length).fill(null);
      /* Built the same way as a caption line so the ink driver can treat both
         alike. RTL is the container's job -- the spans go in source order and
         the browser lays them right to left. */
      for (const spec of AR_LINES) {
        const host = document.querySelector(spec.host);
        const [from, to] = spec.range;
        for (let i = from; i <= to; i++) {
          const outer = document.createElement("span");
          outer.className = "w";
          const inner = document.createElement("i");
          inner.className = "wi";
          inner.style.fontStyle = "normal";
          inner.textContent = AR[i][2];
          outer.appendChild(inner);
          arEls[i] = inner;
          host.appendChild(outer);
          if (i < to) host.appendChild(document.createTextNode(" "));
        }
      }

      for (const spec of LINES) {
        /* A line normally goes into its beat; a mark's label is already a
           node of its own, and the word spans are built straight into it. */
        const host = spec.host ? document.querySelector(spec.host)
                               : document.querySelector("#" + spec.beat + " .bmv");
        const line = spec.host ? host : document.createElement("div");
        if (!spec.host) line.className = spec.cls;

        const [from, to] = spec.range;
        const mk = spec.mark || null;
        let markHost = null;

        for (let i = from; i <= to; i++) {
          const inMark = mk && i >= mk[0] && i <= mk[1];
          if (mk && i === mk[0]) {
            markHost = document.createElement("span");
            markHost.className = "mk";
            line.appendChild(markHost);
          }
          (inMark ? markHost : line).appendChild(makeWord(i));
          if (inMark && i === mk[1]) {
            const bar = document.createElement("span");
            bar.className = "mk-bar";
            bar.id = "mkbar-" + spec.beat;
            markHost.appendChild(bar);
          }
          /* A space BETWEEN two marked words belongs inside the marked run, or
             the two collide ("noreason"). The space that ENDS the run belongs
             to the line, or the underline stretches past what it marks. */
          if (i < to) {
            const nextInMark = mk && (i + 1) >= mk[0] && (i + 1) <= mk[1];
            (inMark && nextInMark ? markHost : line)
              .appendChild(document.createTextNode(" "));
          }
        }
        if (!spec.host) {
          const row = host.querySelector(".icons");
          if (row) host.insertBefore(line, row); else host.appendChild(line);
        }
      }

      /* The rail advances with the recording, and the foot sits under it.
         Both leave before the card lands, so the mark is alone on the paper
         and the foot's wordmark is not under a second one saying the same. */
      tl.set("#rail-fill", { scaleX: 0 }, 0);
      tl.to("#rail-fill", { scaleX: 1, duration: SPEECH_END, ease: "none" }, 0);
      tl.to(".rail", { opacity: 0, duration: 0.22, ease: "power2.in" }, SPEECH_END + 0.20);

      tl.set("#foot", { opacity: 0 }, 0);
      tl.to("#foot", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.4);
      tl.to("#foot", { opacity: 0, duration: 0.22, ease: "power2.in" }, SPEECH_END + 0.20);

      /* Distinct entrance per beat, but all of them travel UP: a spent beat
         leaves through the top while its successor arrives from below, so a
         swap reads as one roll rather than two unrelated events. */
      const ENTER = {
        words: { y: 0,  ease: "power3.out",    duration: 0.30 },
        rise:  { y: 46, ease: "power3.out",    duration: 0.34 },
        fast:  { y: 34, ease: "power4.out",    duration: 0.22 },
        side:  { y: 40, ease: "circ.out",      duration: 0.36 },
        tilt:  { y: 52, ease: "power3.out",    duration: 0.38 },
        hero:  { y: 64, ease: "back.out(1.5)", duration: 0.42 },
        slam:  { y: 78, ease: "power4.out",    duration: 0.40 }
      };

      BEATS.forEach((b, bi) => {
        const mv = "#" + b.el.slice(1) + " .bmv";
        /* A beat's last word ends where the next beat's first word starts, so
           there is no silent gap to cut in. The spent beat leaves in the 0.14s
           before the boundary -- four frames early on a word the eye has
           already read, which is how any subtitle sets its out-point -- and
           the new one starts two frames later. Overlap is under one frame. */
        const inAt  = Math.max(0, b.from - 0.02);
        const outAt = b.to - 0.14;
        const spec  = ENTER[b.enter];

        if (b.enter === "words") {
          /* The opening beat has no predecessor to roll off, so its entrance
             IS the speech: each word lifts as he says it. */
          tl.set(b.el, { opacity: 1 }, 0);
          const first = LINES.find((l) => l.beat === b.el.slice(1));
          const last  = LINES.filter((l) => l.beat === b.el.slice(1)).pop();
          for (let i = first.range[0]; i <= last.range[1]; i++) {
            if (!wordEls[i]) continue;
            const at = Math.max(0, WORDS[i][0] - 0.05);
            tl.fromTo(wordEls[i].parentElement, { y: 52, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.30, ease: "power3.out",
                immediateRender: false }, at);
          }
        } else {
          tl.set(b.el, { opacity: 0 }, 0);
          tl.set(b.el, { opacity: 1 }, inAt);
          tl.fromTo(mv, { y: spec.y, opacity: 0 },
            { y: 0, opacity: 1, ease: spec.ease, duration: spec.duration,
              immediateRender: false }, inAt);
        }

        /* The last beat holds to the final frame -- a climax that scaled back
           out would take the line away before it had been read. */
        if (bi < BEATS.length - 1) {
          tl.to(mv, { y: -34, opacity: 0, duration: 0.14, ease: "power2.in" }, outAt);
          tl.set(b.el, { opacity: 0 }, b.to - 0.005);
        }
      });

      /* The ochre marker, under the words the sentence turns on. It draws
         across exactly the span of time he spends saying them. */
      function sweep(id, from, to) {
        tl.set(id, { scaleX: 0 }, 0);
        tl.to(id, { scaleX: 1, duration: Math.max(0.18, to - from),
                    ease: "power1.out" }, from);
      }
      sweep("#mkbar-d1", 35.50, 37.18);
      sweep("#mkbar-d4", 49.94, 50.86);
      sweep("#mkbar-d5", 51.46, 52.08);
      sweep("#mkbar-d6", 56.66, 57.72);

      /* The hadith cards: the Arabic first, then the transliteration, then
         what it means -- the phrase before its gloss. The gloss lands on the
         word he says it with, so the card reads at his pace and not the
         page's. */
      const HEROES = [
        ["#ha1", 0.08, 0.62],
        ["#hla", 11.68, 12.10],
        ["#h1", 23.08, 23.90],
        ["#h2", 28.08, 30.20],
      ];
      HEROES.forEach(([h, tRule, tEn]) => {
        tl.set(h + " .hero-rule", { scaleX: 0 }, 0);
        tl.to(h + " .hero-rule", { scaleX: 1, duration: 0.38, ease: "power2.out" }, tRule);
        /* An explicit hidden state at t=0. The card's parent is on screen
           before these two lines are, and a fromTo with immediateRender:false
           paints nothing until its own start -- so without this they simply
           sit there at full opacity. Opacity, not display, so the Arabic
           above them does not move when they arrive. */
        tl.set(h + " .hero-en", { opacity: 0 }, 0);
        tl.fromTo(h + " .hero-en", { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.28, ease: "power2.out", immediateRender: false }, tEn);
      });

      /* Each drawn mark arrives as he names the thing: he is listing, and a
         list read out loud arrives one item at a time. They stay once in, so
         by the end of the line all four are on the page together and the list
         can be seen as a whole. */
      const ICONS = [
        ["#ic-d2-salah", 40.90],
        ["#ic-d2-beads", 41.78],
        ["#ic-d2-crescent", 42.70],
        ["#ic-d2-kaaba", 43.46],
        ["#ic-d4-sunrise", 49.94],
      ];
      ICONS.forEach(([sel, at]) => {
        tl.set(sel, { opacity: 0, scale: 0.7, y: 14 }, 0);
        tl.to(sel, { opacity: 1, scale: 1, y: 0, duration: 0.34,
                     ease: "back.out(1.7)" }, at);
      });

      /* The book, beside the sourcing. It opens as he names the collection and
         shuts as he hands over to the hadith itself. The two covers swing out
         from the spine and the ruled lines draw on afterwards, so it reads as
         a book being opened rather than a picture of one fading up.

         svgOrigin, not transformOrigin: on an SVG group the percentage form is
         resolved against the element's own bounding box, which for the left
         cover is nowhere near the spine — it would swing from its outer edge. */
      const BOOK_IN  = 13.14;
      const BOOK_OUT = 23.00;
      tl.set("#book", { opacity: 0 }, 0);
      tl.to("#book", { opacity: 1, duration: 0.26, ease: "power2.out" }, BOOK_IN);
      tl.set("#bk-spine", { scaleY: 0, svgOrigin: "165 105" }, 0);
      tl.to("#bk-spine", { scaleY: 1, duration: 0.30, ease: "power2.out" }, BOOK_IN + 0.04);
      ["#bk-l", "#bk-r"].forEach((g) => {
        tl.set(g, { scaleX: 0.03, svgOrigin: "165 105" }, 0);
        tl.to(g, { scaleX: 1, duration: 0.66, ease: "power3.out" }, BOOK_IN + 0.20);
      });
      tl.set(".bk-lines line", { scaleX: 0, transformOrigin: "0% 50%" }, 0);
      tl.to(".bk-lines line", { scaleX: 1, duration: 0.42, ease: "power2.out",
                                stagger: 0.10 }, BOOK_IN + 0.76);
      /* It shuts the way it opened, and is gone before the hadith card lands. */
      ["#bk-l", "#bk-r"].forEach((g) => {
        tl.to(g, { scaleX: 0.03, duration: 0.34, ease: "power2.in" }, BOOK_OUT - 0.46);
      });
      tl.to("#book", { opacity: 0, duration: 0.20, ease: "power2.in" }, BOOK_OUT - 0.20);

      /* The close. Both reveals are clips, not fades: fading a child inside a
         group that is itself fading compounds the two, and a half-opaque
         glyph measures as a contrast failure mid-entrance even though its
         resting state is 13:1. A clip slides at full ink the whole way. */
      const CLOSE_IN = 59.60;
      tl.set("#close .tile", { scale: 0.7, opacity: 0 }, 0);
      tl.to("#close .tile", { scale: 1, opacity: 1, duration: 0.42,
                              ease: "back.out(1.6)" }, CLOSE_IN + 0.10);
      tl.set("#close .wordmark", { yPercent: 115 }, 0);
      tl.to("#close .wordmark", { yPercent: 0, duration: 0.46, ease: "power3.out" },
            CLOSE_IN + 0.26);
      tl.set("#close .xm", { opacity: 0 }, 0);
      tl.to("#close .xm", { opacity: 1, duration: 0.30, ease: "power2.out" },
            CLOSE_IN + 0.62);
      tl.set("#close .sgs", { yPercent: 115 }, 0);
      tl.to("#close .sgs", { yPercent: 0, duration: 0.44, ease: "power3.out" },
            CLOSE_IN + 0.70);
      tl.set("#close-rule", { scaleX: 0 }, 0);
      tl.to("#close-rule", { scaleX: 1, duration: 0.42, ease: "power2.out" },
            CLOSE_IN + 1.02);
      tl.set("#close .close-url", { yPercent: 115 }, 0);
      tl.to("#close .close-url", { yPercent: 0, duration: 0.40, ease: "power3.out" },
            CLOSE_IN + 1.18);

      /* ONE linear driver for every word: it writes COLOUR ONLY. No glow (a
         dark-mode device, wrong on paper) and no per-word scale (half a pixel
         a frame under a large serif is the sub-pixel shimmer this project has
         already had to remove twice). Ink is enough.

         Three states, each legible on its own: not yet spoken (3.9:1), spoken
         and settled (5.4:1), being spoken (13:1). */
      const ATTACK = 0.05;
      const RELEASE = 0.34;
      const REST_LEVEL = 0.35;
      const REST_RGB = { r: 0x7e, g: 0x7a, b: 0x6f };
      const INK_RGB  = { r: 0x29, g: 0x26, b: 0x21 };

      function envelope(t, start, end) {
        if (t < start) return 0;
        if (t < end) return Math.min((t - start) / ATTACK, 1);
        const releaseEnd = end + RELEASE;
        if (t < releaseEnd) return 1 - ((t - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      function chan(a, b, t) { return Math.round(a + (b - a) * t); }

      const driver = { t: 0 };
      tl.to(driver, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: () => {
          const paint = (tbl, els) => {
            for (let i = 0; i < tbl.length; i++) {
              const el = els[i];
              if (!el) continue;
              const e = envelope(driver.t, tbl[i][0], tbl[i][1]);
              el.style.color = "rgb(" + chan(REST_RGB.r, INK_RGB.r, e) + ","
                                      + chan(REST_RGB.g, INK_RGB.g, e) + ","
                                      + chan(REST_RGB.b, INK_RGB.b, e) + ")";
            }
          };
          paint(WORDS, wordEls);
          paint(AR, arEls);
        }
      }, 0);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
